[package]
name = "faier-traits"
version = "0.24.2"
edition = "2021"
authors = ["sarah quiñones <sarah@veganb.tw>"]
description = "linear algebra library — maintained fork of faer with AI-assisted fixes"
readme = "../README.md"
documentation = "https://docs.rs/faier-traits"
repository = "https://github.com/rjwalters/faier"
license = "MIT"
keywords = ["math", "linear-algebra"]
categories = ["mathematics", "science"]

[lib]
name = "faer_traits"

[dependencies]
bytemuck = "1.24.0"
reborrow = "0.5.5"
generativity = "1.1.0"
libm = { version = "0.2.15", default-features = false }

dyn-stack = { version = "0.13.2", default-features = false, features = ["core-error", "alloc"] }
pulp = { version = "0.22.2", default-features = false }

num-complex = { version = "0.4.6", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
qd = { version = "0.8.0", default-features = false }

[features]
default = [
  "std"
]
std = [
  "pulp/std",
  "qd/std",
  "num-traits/std",
  "num-complex/std",
  "libm/arch",
]
