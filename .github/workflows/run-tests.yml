on:
  push:
    branches:
      - main
  pull_request:

name: Run Tests

jobs:
  msrv:
    name: msrv-${{ matrix.toolchain }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.84.0
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: MSRV 1.84.0
        run:
          cd ./faer-traits &&
          cargo check &&
          cd ../faer &&
          cargo check

  nostd:
    name: nostd-${{ matrix.toolchain }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - nightly-2025-01-08
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: faer-no-std-test

      - name: nostd
        run:
          cd ./faer-no-std-test &&
          cargo run --profile nostd

  testing:
    name: testing-${{ matrix.toolchain }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
        os:
          - ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install latest nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install OpenBLAS by apt
        run: |
          sudo apt update
          sudo apt install -y libopenblas-dev liblapack-dev
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Collect coverage data
        run: cd faer && cargo llvm-cov nextest --features=unstable --lcov --output-path ../lcov.info

      # The fork has no CODECOV_TOKEN, so the upload is best-effort: it never
      # fails the job. The lcov report is also kept as a workflow artifact.
      - name: Upload coverage data to codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
