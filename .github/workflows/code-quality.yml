on:
  push:
    branches:
      - main
  pull_request:

name: Assess Code Quality

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Pinned so a new nightly clippy/rustfmt cannot turn CI red on its own.
      # This is the toolchain `cargo clippy --all-targets` was verified clean
      # on (rustc 1.98.0-nightly cb46fbb8c 2026-06-08). Bump deliberately.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-09
          components: clippy, rustfmt

      # Non-gating for now: `cargo fmt --all -- --check` reports diffs in
      # fork-added code (tracked in #9). Make it gate
      # once the tree is formatted.
      - name: Formatting check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Linting check
        run: cargo clippy --all-targets
