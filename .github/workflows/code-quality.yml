on:
  push:
    branches:
      - main
  pull_request:

name: Assess Code Quality

permissions:
  contents: read

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Pinned so a new nightly clippy/rustfmt cannot turn CI red on its own.
      # This is the toolchain `cargo clippy --all-targets` was verified clean
      # on (rustc 1.98.0-nightly cb46fbb8c 2026-06-08). Bump deliberately.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: nightly-2026-06-09
          components: clippy, rustfmt

      # Non-gating for now: `cargo fmt --all -- --check` reports diffs in
      # fork-added code (tracked in #9). Make it gate
      # once the tree is formatted.
      - name: Formatting check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Linting check
        run: cargo clippy --all-targets
