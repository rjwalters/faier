[package]
name = "faer-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
faer = { package = "faier", version = "0.25.1", path = "../faer" }
pastey = "0.2.1"

[build-dependencies]
cbindgen = { version = "0.29" }

[features]
default = ["std", "rayon", "rand", "linalg", "sparse-linalg"]
std = ["faer/std"]
rand = ["faer/rand"]
rayon = ["faer/rayon", "std"]
linalg = ["faer/linalg"]
sparse-linalg = ["faer/sparse-linalg"]
